# Publishes Thrivea.Sdk to nuget.org when a tag v<version> is pushed, through nuget.org Trusted Publishing
# (no long-lived API key in secrets). One-time setup on nuget.org, under the organization that owns the Thrivea.*
# prefix: Manage package → Trusted publishers → GitHub Actions, repository thrivea/thrivea-sdk-dotnet, workflow
# release.yml, environment "nuget". Then set the repository variable NUGET_USER to the nuget.org user name.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          dotnet restore Thrivea.Sdk.slnx
          dotnet build Thrivea.Sdk.slnx --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}
          dotnet test Thrivea.Sdk.slnx --no-build --configuration Release
      - name: Pack
        run: dotnet pack src/Thrivea.Sdk/Thrivea.Sdk.csproj --no-build --configuration Release -p:Version=${{ steps.version.outputs.version }} --output artifacts
      - name: nuget.org login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
