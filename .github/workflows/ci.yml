name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Thrivea.Sdk.slnx
      - name: Build
        run: dotnet build Thrivea.Sdk.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Thrivea.Sdk.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx"
      - name: Pack (sanity)
        run: dotnet pack src/Thrivea.Sdk/Thrivea.Sdk.csproj --no-build --configuration Release --output artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
